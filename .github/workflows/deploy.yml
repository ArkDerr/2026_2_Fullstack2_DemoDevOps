name: Productos Docker CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: productos-docker-production
  cancel-in-progress: false

jobs:
  docker:
    name: Construir y desplegar microservicio
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      # El runner descarga el proyecto.
      - name: 1. Descargar codigo
        uses: actions/checkout@v4

      # Docker construye la imagen en el runner, no en EC2.
      - name: 2. Construir imagen Docker Multi-Stage
        run: |
          docker build --platform linux/amd64 \
            -t "productos-service:${GITHUB_SHA}" .

      # Solo desplegamos cuando hay un push a main.
      - name: 3. Empaquetar imagen Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker save "productos-service:${GITHUB_SHA}" \
            | gzip > productos-image.tar.gz

      - name: 4. Preparar conexion SSH
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

          # Para este laboratorio, obtenemos la clave publica del servidor.
          for intento in {1..12}; do
            if ssh-keyscan -T 5 -H "$EC2_HOST" \
              >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            sleep 5
          done
          test -s ~/.ssh/known_hosts

      # SCP copia la imagen del runner a la instancia.
      - name: 5. Copiar imagen Docker a EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          scp -i ~/.ssh/ec2.pem \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            productos-image.tar.gz \
            "${EC2_USER}@${EC2_HOST}:productos-image.tar.gz"

      # SSH ejecuta Docker dentro de EC2; no se instala GitHub Runner alli.
      - name: 6. Actualizar contenedor en EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ssh -i ~/.ssh/ec2.pem \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" "
              set -euo pipefail
              gzip -dc productos-image.tar.gz | docker load
              docker rm -f productos-container 2>/dev/null || true
              docker run -d \
                --name productos-container \
                --restart unless-stopped \
                -p 8081:8081 \
                productos-service:${GITHUB_SHA}
              rm -f productos-image.tar.gz
            "

      # Validamos la API desde la propia EC2.
      - name: 7. Verificar despliegue en EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          for intento in {1..30}; do
            if ssh -i ~/.ssh/ec2.pem \
              "${EC2_USER}@${EC2_HOST}" \
              "curl -fsS http://127.0.0.1:8081/productos >/dev/null"; then
              echo "La API de Productos responde correctamente."
              exit 0
            fi
            sleep 3
          done

          ssh -i ~/.ssh/ec2.pem "${EC2_USER}@${EC2_HOST}" \
            "docker logs --tail 100 productos-container" || true
          exit 1
